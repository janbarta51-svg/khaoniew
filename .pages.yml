media: media

content:
  - name: weekly_menu
    label: Týdenní menu – rychlé vložení
    type: file
    path: weekly-menu.json
    format: json
    fields:
      - name: weekStart
        label: Pondělí tohoto menu
        type: date
        required: true
        description: Vyber datum pondělí týdne, pro který menu platí.
        options:
          time: false
          format: yyyy-MM-dd
      - name: menuText
        label: Sem vlož celý text z Wordu
        type: text
        required: true
        description: Označ ve Wordu celé menu, zkopíruj ho a vlož sem beze změn. Web automaticky rozpozná ceny, jednotlivé dny, polévky, jídla, přílohy, alergeny i dezerty.

settings:
  content:
    merge: false
  commit:
    identity: app
    templates:
      create: "Vytvoření týdenního menu"
      update: "Aktualizace týdenního menu"
