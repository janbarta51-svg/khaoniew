media: images

content:
  - name: weekly_menu
    label: Týdenní menu
    type: file
    path: weekly-menu.json
    format: json
    fields:
      - name: weekStart
        label: Datum pondělí
        type: date
        required: true
        description: Vyber pondělí týdne, pro který menu platí.
        options:
          time: false
          format: yyyy-MM-dd
      - name: menuText
        label: Text menu z Wordu
        type: text
        required: true
        description: Zkopíruj celý text menu z Wordu, vlož ho sem a klikni na Uložit. Web sám rozdělí dny, jídla, ceny i alergeny.

settings:
  content:
    merge: false
  commit:
    identity: app
    templates:
      create: "Nové týdenní menu"
      update: "Aktualizace týdenního menu"
